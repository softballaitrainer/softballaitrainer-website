<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" preserveAspectRatio="xMidYMid slice">
  <!-- Navy background with subtle gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2838"/>
      <stop offset="100%" stop-color="#0F1820"/>
    </linearGradient>
    <linearGradient id="softballGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE680"/>
      <stop offset="100%" stop-color="#FFD93D"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid of dots for texture -->
  <g fill="#FFFFFF" opacity="0.04">
    <circle cx="100" cy="100" r="2"/><circle cx="200" cy="100" r="2"/><circle cx="300" cy="100" r="2"/>
    <circle cx="400" cy="100" r="2"/><circle cx="500" cy="100" r="2"/><circle cx="600" cy="100" r="2"/>
    <circle cx="700" cy="100" r="2"/><circle cx="800" cy="100" r="2"/><circle cx="900" cy="100" r="2"/>
    <circle cx="1000" cy="100" r="2"/><circle cx="1100" cy="100" r="2"/>
    <circle cx="100" cy="200" r="2"/><circle cx="200" cy="200" r="2"/><circle cx="300" cy="200" r="2"/>
    <circle cx="400" cy="200" r="2"/><circle cx="500" cy="200" r="2"/><circle cx="600" cy="200" r="2"/>
    <circle cx="700" cy="200" r="2"/><circle cx="800" cy="200" r="2"/><circle cx="900" cy="200" r="2"/>
    <circle cx="1000" cy="200" r="2"/><circle cx="1100" cy="200" r="2"/>
    <circle cx="100" cy="300" r="2"/><circle cx="200" cy="300" r="2"/><circle cx="300" cy="300" r="2"/>
    <circle cx="400" cy="300" r="2"/><circle cx="500" cy="300" r="2"/><circle cx="600" cy="300" r="2"/>
    <circle cx="700" cy="300" r="2"/><circle cx="800" cy="300" r="2"/><circle cx="900" cy="300" r="2"/>
    <circle cx="1000" cy="300" r="2"/><circle cx="1100" cy="300" r="2"/>
    <circle cx="100" cy="400" r="2"/><circle cx="200" cy="400" r="2"/><circle cx="300" cy="400" r="2"/>
    <circle cx="400" cy="400" r="2"/><circle cx="500" cy="400" r="2"/><circle cx="600" cy="400" r="2"/>
    <circle cx="700" cy="400" r="2"/><circle cx="800" cy="400" r="2"/><circle cx="900" cy="400" r="2"/>
    <circle cx="1000" cy="400" r="2"/><circle cx="1100" cy="400" r="2"/>
    <circle cx="100" cy="500" r="2"/><circle cx="200" cy="500" r="2"/><circle cx="300" cy="500" r="2"/>
    <circle cx="400" cy="500" r="2"/><circle cx="500" cy="500" r="2"/><circle cx="600" cy="500" r="2"/>
    <circle cx="700" cy="500" r="2"/><circle cx="800" cy="500" r="2"/><circle cx="900" cy="500" r="2"/>
    <circle cx="1000" cy="500" r="2"/><circle cx="1100" cy="500" r="2"/>
  </g>

  <!-- Softball on right side -->
  <g transform="translate(880 315)">
    <circle r="150" fill="url(#softballGrad)"/>
    <!-- Softball laces (curved red stitches) -->
    <path d="M -120 -30 Q -60 -60 0 -60 Q 60 -60 120 -30" stroke="#1B2838" stroke-width="2" fill="none" opacity="0.3"/>
    <path d="M -120 30 Q -60 60 0 60 Q 60 60 120 30" stroke="#1B2838" stroke-width="2" fill="none" opacity="0.3"/>
    <g stroke="#C72030" stroke-width="2.5" fill="none" stroke-linecap="round">
      <!-- Top curve stitches -->
      <path d="M -100 -45 l 8 -4"/>
      <path d="M -80 -55 l 8 -4"/>
      <path d="M -60 -60 l 8 -3"/>
      <path d="M -40 -62 l 8 -2"/>
      <path d="M -20 -62 l 8 -1"/>
      <path d="M 0 -62 l 8 0"/>
      <path d="M 20 -62 l 8 1"/>
      <path d="M 40 -62 l 8 2"/>
      <path d="M 60 -60 l 8 3"/>
      <path d="M 80 -55 l 8 4"/>
      <path d="M 100 -45 l 8 4"/>
      <!-- Bottom curve stitches -->
      <path d="M -100 45 l 8 4"/>
      <path d="M -80 55 l 8 4"/>
      <path d="M -60 60 l 8 3"/>
      <path d="M -40 62 l 8 2"/>
      <path d="M -20 62 l 8 1"/>
      <path d="M 0 62 l 8 0"/>
      <path d="M 20 62 l 8 -1"/>
      <path d="M 40 62 l 8 -2"/>
      <path d="M 60 60 l 8 -3"/>
      <path d="M 80 55 l 8 -4"/>
      <path d="M 100 45 l 8 -4"/>
    </g>
  </g>

  <!-- Text block on left -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- Green accent bar -->
    <rect x="80" y="195" width="60" height="5" fill="#00E676" rx="2"/>

    <!-- Main title -->
    <text x="80" y="285" font-size="72" font-weight="800" fill="#FFFFFF" letter-spacing="-1">Softball</text>
    <text x="80" y="365" font-size="72" font-weight="800" fill="#FFFFFF" letter-spacing="-1">AI Trainer</text>

    <!-- Tagline -->
    <text x="80" y="420" font-size="28" font-weight="600" fill="#00E676">AI-Powered Softball Training</text>

    <!-- Supporting line -->
    <text x="80" y="470" font-size="20" font-weight="400" fill="rgba(255,255,255,0.7)">Video analysis for pitching &amp; hitting. Ages 10U — College.</text>

    <!-- Domain at bottom -->
    <text x="80" y="555" font-size="18" font-weight="500" fill="rgba(255,255,255,0.5)" letter-spacing="1">SOFTBALLAITRAINER.COM</text>
  </g>
</svg>
